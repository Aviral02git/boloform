<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo Form - Voice Form Helper</title>
<style>
    body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; background:#f4f2f1; color:#251f21; margin:0; padding:24px; }
    .card { max-width:560px; margin:0 auto; background:#fff; border-radius:14px; padding:24px; box-shadow:0 2px 10px rgba(0,0,0,.08); }
    h1 { font-size:20px; margin:0 0 4px; }
    .banner { background:#fdf3e3; border:1px solid #ecd9ae; border-radius:8px; padding:8px 12px; font-size:13px; margin:12px 0 20px; }
    h2 { font-size:14px; color:#585254; margin:22px 0 10px; text-transform:uppercase; letter-spacing:.04em; }
    label { display:block; font-size:13px; color:#585254; margin:12px 0 4px; }
    input, select, textarea { width:100%; box-sizing:border-box; padding:9px 10px; border:1px solid #d9d5d4; border-radius:8px; font-size:14px; }
    input[readonly] { background:#efedec; color:#8a8486; }
    .row { display:flex; gap:12px; } .row > div { flex:1; }
</style>
</head>
<body>
<div class="card">
    <h1>Income Certificate Application (DEMO)</h1>
    <div class="banner">Demo form hai - sirf dummy data ke liye. Yahan kuch submit nahi hota, kahin kuch nahi jaata. Real Aadhaar/PAN/phone/address mat daalna.</div>

    <h2>Personal details</h2>
    <label for="full-name">Full Name / पूरा नाम</label>
    <input id="full-name" name="full_name" type="text" autocomplete="off">
    <label for="father-name">Father's Name / पिता का नाम</label>
    <input id="father-name" name="father_name" type="text" autocomplete="off">
    <div class="row">
        <div>
            <label for="dob">Date of Birth / जन्म तिथि</label>
            <input id="dob" name="dob" type="text" placeholder="DD/MM/YYYY" autocomplete="off">
        </div>
        <div>
            <label for="gender">Gender / लिंग</label>
            <select id="gender" name="gender">
                <option value="">Select</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
            </select>
        </div>
    </div>

    <h2>Address</h2>
    <label for="house">House / Flat No / Apartment Name</label>
    <input id="house" name="house" type="text" autocomplete="off">
    <label for="street">Street / Area</label>
    <input id="street" name="street" type="text" autocomplete="off">
    <div class="row">
        <div>
            <label for="pincode">Pincode</label>
            <input id="pincode" name="pincode" type="text" inputmode="numeric" autocomplete="off">
        </div>
        <div>
            <label for="city">City (site khud bharti hai)</label>
            <input id="city" name="city" type="text" readonly placeholder="PIN se auto">
        </div>
    </div>
    <label for="state">State (site khud bharti hai)</label>
    <input id="state" name="state" type="text" readonly placeholder="PIN se auto">

    <h2>Application details</h2>
    <label for="occupation">Occupation / पेशा</label>
    <input id="occupation" name="occupation" type="text" autocomplete="off">
    <label for="income">Annual Income / वार्षिक आय</label>
    <input id="income" name="income" type="text" autocomplete="off">
    <label for="purpose">Purpose / उद्देश्य</label>
    <input id="purpose" name="purpose" type="text" autocomplete="off">
    <div class="row">
        <div>
            <label for="phone">Phone / फोन</label>
            <input id="phone" name="phone" type="tel" value="9876500000" autocomplete="off">
        </div>
        <div>
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="off">
        </div>
    </div>
</div>
</body>
</html>
