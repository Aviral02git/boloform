<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Snitch-style add-address replica (dummy data)</title>
<style>
  body{font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;background:#f7f6f5;margin:24px;color:#222}
  .card{background:#fff;border:1px solid #e3e0de;border-radius:12px;padding:20px;max-width:420px}
  .card h2{margin:0 0 14px;font-size:17px}
  label{display:block;font-size:12px;color:#666;margin:12px 0 4px}
  input{width:100%;box-sizing:border-box;padding:9px 10px;border:1px solid #c9c5c3;border-radius:8px;font-size:14px}
  input[readonly]{background:#f0efee;color:#666}
  .phone{display:flex;gap:6px;align-items:center}
  .phone .cc{border:1px solid #c9c5c3;border-radius:8px;padding:9px 8px;background:#f7f6f5}
  #results{max-width:460px;margin-top:22px;font-size:13px}
  #results .pass{color:#2f7a67}#results .fail{color:#b3261e;font-weight:600}
  #results div{padding:2px 0}
  .vfh-highlight{outline:2px solid #2f7a67 !important;background:#eef6f3 !important}
</style>
</head>
<body>
<div class="card">
  <h2>Add new address</h2>
  <input type="text" placeholder="House / Flat No / Apartment Name" aria-label="House / Flat No / Apartment Name">
  <input type="text" placeholder="Street / Area" aria-label="Street / Area">
  <input type="text" placeholder="Pincode" aria-label="Pincode">
  <label for="rcity">City</label><input id="rcity" type="text" value="Ludhiana" readonly>
  <label for="rstate">State</label><input id="rstate" type="text" value="Punjab" readonly>
  <input type="text" placeholder="Name" aria-label="Name">
  <label>Phone</label>
  <div class="phone"><span class="cc">+91</span><input type="tel" autocomplete="tel-national"></div>
</div>
<div id="results"></div>

<script src="../parser.js"></script>
<script src="../matcher.js"></script>
<script>
(function () {
  var out = document.getElementById('results');
  var pass = 0, fail = 0;
  function line(ok, name) {
    var d = document.createElement('div');
    d.className = ok ? 'pass' : 'fail';
    d.textContent = (ok ? 'PASS: ' : 'FAIL: ') + name;
    out.appendChild(d);
    ok ? pass++ : fail++;
  }
  function inp(ph) { return document.querySelector('input[placeholder="' + ph + '"]'); }
  var house = inp('House / Flat No / Apartment Name'), street = inp('Street / Area'),
      pin = inp('Pincode'), name = inp('Name'), tel = document.querySelector('input[type=tel]');

  // Scenario 1: the original failure. Pre-existing house value must NOT be overwritten by Name.
  house.value = '9B'; // user had already typed a house number
  var t1 = '- House: 452A\n- Street: Model Town Phase 2\n- PIN: 148001\n- Name: Rahul Sharma\n- Phone number: 9876501234';
  var r1 = window.VFHMatcher.fillFromTranscript(t1, document);
  line(name.value === 'Rahul Sharma', 'name lands in the Name field, got "' + name.value + '"');
  line(house.value === '452A', 'house field holds directed house value, got "' + house.value + '"');
  line(street.value === 'Model Town Phase 2', 'street field filled, got "' + street.value + '"');
  line(pin.value === '148001', 'pincode field filled, got "' + pin.value + '"');
  line(tel.value === '9876501234', 'unlabeled +91 tel input found structurally, got "' + tel.value + '"');
  var oldHouse = r1.filled.find(function (f) { return f.key === 'house'; });
  line(oldHouse && oldHouse.oldValue === '9B', 'pre-existing house value reported as oldValue: ' + (oldHouse && oldHouse.oldValue));

  // Scenario 2: two values for one detail in one message -> ask, keep first, no overwrite.
  var r2 = window.VFHMatcher.fillFromTranscript('flat 7B, house 5A', document);
  line(house.value === '7B', 'first of two conflicting values applied, got "' + house.value + '"');
  line(r2.asks.length === 1, 'second conflicting value asks instead of overwriting, asks=' + r2.asks.length);
  line(r2.asks.length === 1 && r2.asks[0].value === '5A', 'ask carries the skipped value for manual pick');
  window.VFHMatcher.clearHighlights(document);

  // Scenario 3: readonly City/State stay untouched.
  var r3 = window.VFHMatcher.fillFromTranscript('city Patiala, state Haryana', document);
  var city = document.querySelectorAll('input[readonly]')[0];
  line(city.value === 'Ludhiana' && r3.locked.length === 2, 'readonly City/State locked and skipped, locked=' + r3.locked.length);

  // Scenario 4: manual field binding (fillElement) - the "Field chuno" fallback.
  var r4 = window.VFHMatcher.fillElement(pin, '160055');
  line(r4.ok && pin.value === '160055', 'manual field pick fills chosen field, got "' + pin.value + '"');
  line(r4.oldValue === '148001', 'manual pick reports previous value: ' + r4.oldValue);
  var r5 = window.VFHMatcher.fillElement(city, 'Ambala');
  line(!r5.ok && city.value === 'Ludhiana', 'manual pick refuses locked field: ' + r5.reason);

  var sum = document.createElement('div');
  sum.className = fail ? 'fail' : 'pass';
  sum.style.marginTop = '10px';
  sum.style.fontWeight = '700';
  sum.textContent = 'DOM TEST: ' + pass + ' passed, ' + fail + ' failed';
  out.appendChild(sum);
  document.title = fail ? 'FAIL' : 'PASS';
})();
</script>
</body>
</html>
