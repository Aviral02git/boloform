<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Snitch-style add-address replica (dummy data)</title>
<style>
  body{font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;background:#f7f6f5;margin:24px;color:#222}
  .card{background:#fff;border:1px solid #e3e0de;border-radius:12px;padding:20px;max-width:420px}
  .card h2{margin:0 0 14px;font-size:17px}
  label{display:block;font-size:12px;color:#666;margin:12px 0 4px}
  input{width:100%;box-sizing:border-box;padding:9px 10px;border:1px solid #c9c5c3;border-radius:8px;font-size:14px}
  input[readonly]{background:#f0efee;color:#666}
  .phone{display:flex;gap:6px;align-items:center}
  .phone .cc{border:1px solid #c9c5c3;border-radius:8px;padding:9px 8px;background:#f7f6f5}
  #results{max-width:460px;margin-top:22px;font-size:13px}
  #results .pass{color:#2f7a67}#results .fail{color:#b3261e;font-weight:600}
  #results div{padding:2px 0}
</style>
</head>
<body>
<div class="card">
  <h2>Add new address</h2>
  <input type="text" placeholder="House / Flat No / Apartment Name" aria-label="House / Flat No / Apartment Name">
  <input type="text" placeholder="Street / Area" aria-label="Street / Area">
  <input type="text" placeholder="Pincode" aria-label="Pincode">
  <label for="rcity">City</label><input id="rcity" type="text" value="Ludhiana" readonly>
  <label for="rstate">State</label><input id="rstate" type="text" value="Punjab" readonly>
  <input type="text" placeholder="Name" aria-label="Name">
  <label>Phone</label>
  <span class="cc">+91</span><input type="text" placeholder="1234567890" id="phonein">
</div>
<div id="results"></div>

<script src="../parser.js"></script>
<script src="../matcher.js"></script>
<script src="../content.js"></script>
<script>
(function () {
  var stage = new URLSearchParams(location.search).get('stage') || 'full';
  var out = document.getElementById('results');
  var pass = 0, fail = 0;
  function line(ok, name) {
    var d = document.createElement('div');
    d.className = ok ? 'pass' : 'fail';
    d.textContent = (ok ? 'PASS: ' : 'FAIL: ') + name;
    out.appendChild(d);
    ok ? pass++ : fail++;
  }
  function summary() {
    var sum = document.createElement('div');
    sum.className = fail ? 'fail' : 'pass';
    sum.style.marginTop = '10px';
    sum.style.fontWeight = '700';
    sum.textContent = 'DOM TEST: ' + pass + ' passed, ' + fail + ' failed';
    out.appendChild(sum);
    document.title = fail ? 'FAIL' : 'PASS';
  }
  function inp(ph) { return document.querySelector('input[placeholder="' + ph + '"]'); }
  var house = inp('House / Flat No / Apartment Name'), street = inp('Street / Area'),
      pin = inp('Pincode'), name = inp('Name'),
      tel = document.getElementById('phonein'),
      city = document.getElementById('rcity');

  var TRANSCRIPT = '- House flat number apartment name \u092e\u0947\u0902 2A Block 45 \u092d\u0930\u094b\n- Street area \u092e\u0947\u0902 Shanti \u0915\u093e Colony\n- Pin code \u092e\u0947\u0902 148001\n- City Rampura\n- State \u092e\u0947\u0902 Punjab\n- Name \u092e\u0947\u0902 Rahul Sharma\n- Phone number \u092e\u0947\u0902 9876501234';

  // --- Plan stage: preview must not write anything ---
  house.value = '9B'; // pre-existing user value
  var plan = window.VFHMatcher.planFromTranscript(TRANSCRIPT, document);
  line(house.value === '9B' && name.value === '' && tel.value === '', 'plan stage writes nothing to the page');
  line(plan.items.length === 7 && plan.hasWrites, 'all 7 details planned, items=' + plan.items.length);
  var nameItem = plan.items.find(function (i) { return i.key === 'name'; });
  line(nameItem && nameItem.fieldLabel === 'name', 'name maps to the Name field, got "' + (nameItem && nameItem.fieldLabel) + '"');
  var houseItem = plan.items.find(function (i) { return i.key === 'house'; });
  line(houseItem && houseItem.fieldLabel.indexOf('apartment') !== -1, 'house maps to the house field');
  line(houseItem && houseItem.oldValue === '9B', 'pre-existing house value captured for preview: ' + (houseItem && houseItem.oldValue));
  var phoneItem = plan.items.find(function (i) { return i.key === 'phone'; });
  line(phoneItem && phoneItem.status === 'write', 'digit-placeholder +91 phone input found, status=' + (phoneItem && phoneItem.status));
  var streetItem = plan.items.find(function (i) { return i.key === 'street'; });
  line(streetItem && streetItem.value === 'Shanti \u0915\u093e Colony', 'street value keeps "\u0915\u093e Colony": "' + (streetItem && streetItem.value) + '"');

  // --- Apply stage: approved write lands correctly ---
  var report = window.VFHMatcher.applyPlan(plan);
  line(name.value === 'Rahul Sharma', 'name lands in the Name field, got "' + name.value + '"');
  line(house.value === '2A Block 45', 'house field holds directed house value, got "' + house.value + '"');
  line(street.value === 'Shanti \u0915\u093e Colony', 'street field holds full value, got "' + street.value + '"');
  line(pin.value === '148001', 'pincode filled');
  line(phoneItem.el === tel, 'phone plans onto the phone input itself, not a neighbouring field');

  // House ID separators survive exactly as dictated (dash or slash).
  var planSep = window.VFHMatcher.planFromTranscript('- House number \u092e\u0942\u0902 \u092d\u0930\u094b: 2A/45', document);
  var sepItem = planSep.items.find(function (i) { return i.key === 'house'; });
  line(sepItem && sepItem.value === '2A/45', 'house ID keeps its slash: "' + (sepItem && sepItem.value) + '"');
  var planDash = window.VFHMatcher.planFromTranscript('house 2A-45', document);
  var dashItem = planDash.items.find(function (i) { return i.key === 'house'; });
  line(dashItem && dashItem.value === '2A-45', 'house ID keeps its dash: "' + (dashItem && dashItem.value) + '"');
  var planLbl = window.VFHMatcher.planFromTranscript('- House flat number/apartment number: 2A-45', document);
  var lblItem = planLbl.items.find(function (i) { return i.key === 'house'; });
  line(lblItem && lblItem.value === '2A-45' && lblItem.el === house, 'composite dictated label stripped, only the ID remains: "' + (lblItem && lblItem.value) + '"');
  line(tel.value === '9876501234', 'phone filled in +91 input, got "' + tel.value + '"');
  line(city.value === 'Ludhiana' && report.locked.length === 2, 'readonly City/State locked and skipped, locked=' + report.locked.length);
  var oldHouse = report.filled.find(function (f) { return f.key === 'house'; });
  line(oldHouse && oldHouse.oldValue === '9B', 'replaced house value reported with previous value: ' + (oldHouse && oldHouse.oldValue));

  // --- Conflict: two values for one detail -> ask, no write ---
  var plan2 = window.VFHMatcher.planFromTranscript('flat 7B, house 5A', document);
  line(plan2.asks.length === 1 && plan2.items.length === 1, 'same-key conflict asks once, asks=' + plan2.asks.length);
  line(plan2.asks.length === 1 && plan2.asks[0].value === '5A', 'ask carries the skipped value for manual pick');
  var r2 = window.VFHMatcher.applyPlan(plan2);
  line(house.value === '7B' && r2.filled.length === 1, 'only the first conflicting value applied, got "' + house.value + '"');
  window.VFHMatcher.clearHighlights(document);

  // --- Full panel flow: toolbar-injected code path (same bytes), preview first ---
  window.dispatchEvent(new Event('vfh:toggle'));
  var hostEl = document.getElementById('vfh-host');
  line(!!hostEl && !!hostEl.shadowRoot, 'panel injects into the page');
  if (!hostEl) { summary(); return; }
  var sh = hostEl.shadowRoot;
  var title = sh.querySelector('.vfh-title');
  line(title && /v0\.2\.4/.test(title.textContent), 'panel shows running version marker: "' + (title && title.textContent) + '"');
  var ta = sh.querySelector('textarea');
  ta.value = 'Phone number \u092e\u0947\u0902 9876501234';
  house.value = ''; street.value = ''; pin.value = ''; name.value = ''; tel.value = '';
  var buttons = sh.querySelectorAll('button');
  var fillBtn = Array.prototype.find.call(buttons, function (b) { return b.textContent === 'Form bharo'; });
  fillBtn.click();
  var previewHead = sh.querySelector('.vfh-plan-h');
  line(!!previewHead, 'preview shown after Form bharo');
  line(tel.value === '', 'preview did not write the phone field yet');
  if (stage === 'preview') { summary(); return; } // screenshot stops here, preview visible

  var confirmBtn = Array.prototype.find.call(sh.querySelectorAll('button'), function (b) { return b.textContent === 'Sahi hai, bharo'; });
  line(!!confirmBtn, 'confirm button present in preview');
  confirmBtn.click();
  line(tel.value === '9876501234', 'confirm writes the phone field, got "' + tel.value + '"');
  var doneLine = Array.prototype.find.call(sh.querySelectorAll('.vfh-results div'), function (d) { return d.textContent.indexOf('me bhara: 9876501234') !== -1; });
  line(!!doneLine, 'results list the approved fill');

  // --- Field chuno through real clicks: unmatched detail -> user picks the field ---
  ta.value = 'occupation \u092e\u0947\u0902 Engineer';
  fillBtn.click();
  var pickBtn = Array.prototype.find.call(sh.querySelectorAll('button.vfh-pick'), function (b) { return !b.disabled; });
  line(!!pickBtn, 'Field chuno offered for unmatched detail');
  if (pickBtn) {
    pickBtn.click();
    street.click(); // user points at the street field
    line(street.value === 'Engineer', 'picked field receives the value, got "' + street.value + '"');
  }

  summary();
})();
</script>
</body>
</html>
